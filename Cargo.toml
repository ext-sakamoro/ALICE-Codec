[package]
name = "alice-codec"
publish = false
version = "0.1.3"
edition = "2021"
rust-version = "1.87"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Hyper-Fast 3D Wavelet Video Codec"
license = "LicenseRef-Proprietary"
repository = "https://github.com/ext-sakamoro/ALICE-Codec"
keywords = ["codec", "video", "wavelet", "compression", "rans"]
categories = ["compression", "multimedia::video"]


[lib]
name = "alice_codec"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alice-codec"
path = "src/bin/main.rs"
required-features = ["cli"]

[features]
default = ["std"]
std = []
cli = ["clap"]
simd = []
ffi = ["std"]
python = ["pyo3", "numpy"]
ml = ["dep:alice-ml"]  # ALICE-ML ternary inference for motion estimation
db = ["dep:alice-db", "std"]  # ALICE-DB metrics storage for monitoring
crypto = ["dep:alice-crypto", "std"]  # ALICE-Crypto AEAD encryption for bitstreams
cache = ["dep:alice-cache", "std"]  # ALICE-Cache decoded frame caching

[dependencies]
libm = "0.2"
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", rev = "2d01c63ff0849cf0ab82eafb89f87f1b729bd2a8", version = "0.5.2", default-features = false }
clap = { version = "4.5", features = ["derive"], optional = true }
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
numpy = { version = "0.23", optional = true }
alice-ml = { git = "https://github.com/ext-sakamoro/ALICE-ML", rev = "6e0dd06086b29987237f69e6e049a75ce231e7fb", version = "0.4.0", optional = true, default-features = false, features = ["std"] }
alice-db = { git = "https://github.com/ext-sakamoro/ALICE-DB", rev = "866b8f11575c0bc936bdb322450066625b49e449", version = "0.6.0", optional = true, default-features = false, features = ["fs"] }
alice-crypto = { version = "0.1", optional = true, default-features = false, features = ["std"] }
alice-cache = { version = "0.2", optional = true }

# cargo-machete false-positive 予防
# libm は #![no_std] 経路で使われるが cargo-machete が feature 依存を見落とす
[package.metadata.cargo-machete]
ignored = ["libm"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic = "abort" は撤去 (2026-09-17): FFI の catch_unwind (src/ffi.rs guard) は
# unwind でしか機能せず、abort だと host process ごと落ちる
strip = true

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "wavelet"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
