name: 'ALICE-Codec Optional Bridge Stubs'
description: |
  Create empty stub crates for the ALICE-Codec sibling path deps
  (alice-ml / alice-db / alice-crypto / alice-cache) so that ALICE-Codec
  can resolve its workspace-relative optional path deps in CI.
  These crates are private to the local ALICE Eco-System and not on crates.io.

  Canonical CI template: [[reference_alice_ci_canonical_template]]

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # dir:crate:version — version は Cargo.toml の `version = "..."` 要件を満たすこと
        # (stub が古いと cargo update / audit / deny が「failed to select a version」で落ちる、2026-09-14 事案)
        for entry in \
            ALICE-ML:alice-ml:0.2.0 \
            ALICE-DB:alice-db:0.2.0-beta.1 \
            ALICE-Crypto:alice-crypto:0.1.0 \
            ALICE-Cache:alice-cache:0.2.0; do
          dir="${entry%%:*}"
          rest="${entry#*:}"
          crate="${rest%%:*}"
          version="${rest#*:}"
          mkdir -p "../${dir}/src"
          cat > "../${dir}/Cargo.toml" <<TOML
        [package]
        name = "${crate}"
        version = "${version}"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = ["std"]
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
          : > "../${dir}/src/lib.rs"
        done
        echo "Created stubs: alice-ml / alice-db / alice-crypto / alice-cache (all with license = MIT OR Apache-2.0)"
